version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: speedscale_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedscale_user
      POSTGRES_PASSWORD: speedscale_password
      POSTGRES_DB: speedscale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
